# Render Blueprint - FD Central
# Deploy: https://render.com/deploy?repo=https://github.com/alexdhowe/FDCentral

databases:
  - name: fdcentral-db
    plan: free
    databaseName: fdcentral
    user: fdcentral

services:
  # Backend API
  - type: web
    name: fdcentral-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server && npm run db:migrate --workspace=server
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fdcentral-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://fdcentral.onrender.com

  # Frontend Static Site
  - type: web
    name: fdcentral
    runtime: static
    buildCommand: npm install && npm run build:client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://fdcentral-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
