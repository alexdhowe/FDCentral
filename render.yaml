# Render Blueprint - FDCentral Stock & Options Platform
# Deploy with: https://render.com/deploy

services:
  # Backend API Server
  - type: web
    name: fdcentral-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: fdcentral-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://fdcentral.onrender.com

  # Frontend Static Site
  - type: web
    name: fdcentral
    runtime: static
    buildCommand: npm install && npm run build:client
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fdcentral-api.onrender.com/api/*
      - type: rewrite
        source: /socket.io/*
        destination: https://fdcentral-api.onrender.com/socket.io/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fdcentral-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
